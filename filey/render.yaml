services:
  # Servicio Web Django
  - type: web
    name: filey-backend
    env: docker
    plan: free # Usa 'starter' en producción para evitar hibernación
    region: ohio
    branch: QA
    dockerCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    envVars:
      - key: DATABASE_URL
        sync: false # Debes proveer esta variable en el dashboard de Render (Supabase URL)
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*" # Actualizar a tu dominio final luego
      - key: DJANGO_SSL_REDIRECT
        value: "true"
