version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: filey_db
      POSTGRES_USER: filey_user
      POSTGRES_PASSWORD: filey_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    # Usamos runserver localmente para que se recargue el código al guardar
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - /app/.venv
      - /app/estaticos_recolectados
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=true
      - DATABASE_URL=postgres://filey_user:filey_password@db:5432/filey_db
      - DJANGO_SECRET_KEY=django-insecure-solo-para-desarrollo-filey-local
    depends_on:
      - db

volumes:
  postgres_data:
