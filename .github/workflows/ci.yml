name: CI

on:
  pull_request:
    branches:
      - develop
      - QA
  workflow_dispatch:

jobs:
  test:
    name: Run Pytest & Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./filey

    # Las pruebas necesitan un PostgreSQL de verdad: desde ADR-0003 cada
    # feria vive en su propio schema y SQLite no los tiene, así que ya no
    # sirve como respaldo. El `health-cmd` no es adorno — sin él el paso
    # de pruebas arranca antes de que Postgres acepte conexiones.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: filey_db
          POSTGRES_USER: filey_user
          POSTGRES_PASSWORD: filey_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filey_user -d filey_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Tests
        env:
          DATABASE_URL: "postgres://filey_user:filey_password@localhost:5432/filey_db"
          DJANGO_SECRET_KEY: "dummy-key-for-tests"
          DJANGO_DEBUG: "false"
          DJANGO_SSL_REDIRECT: "false"
        run: |
          pytest

      - name: Check for Missing Migrations
        env:
          DATABASE_URL: "postgres://filey_user:filey_password@localhost:5432/filey_db"
          DJANGO_SECRET_KEY: "dummy-key-for-migrations"
          DJANGO_DEBUG: "false"
        run: |
          python manage.py makemigrations --check --dry-run
