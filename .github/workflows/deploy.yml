name: Deploy to Production

on:
  push:
    branches:
      - project-test

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./filey

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # Se instalan las de desarrollo porque incluyen a las de ejecución
      # (`-r requirements.txt`) y además pytest, que hace falta para el
      # paso siguiente. El contenedor que se despliega no usa este
      # entorno: lo construye Render con requirements.txt a secas.
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Las pruebas van ANTES de migrar. Una migración aplicada contra
      # Supabase no se deshace con un `git revert`: si el código no pasa
      # sus propias pruebas, el despliegue tiene que morir mientras la
      # base de datos sigue intacta.
      #
      # Django sustituye el backend de correo por `locmem` en pruebas
      # (ver CLAUDE.md), así que ninguna sale a la red aunque el runner
      # tuviera credenciales.
      - name: Run Tests
        env:
          DJANGO_SECRET_KEY: "dummy-key-for-tests"
          DJANGO_DEBUG: "false"
        run: |
          pytest

      # Un modelo editado sin generar su migración pasa las pruebas
      # —pytest crea la base desde los modelos, no desde las
      # migraciones— y luego rompe en producción, donde solo existen las
      # migraciones. Este paso es lo que separa los dos casos.
      - name: Check for Missing Migrations
        env:
          DJANGO_SECRET_KEY: "dummy-key-for-migrations"
          DJANGO_DEBUG: "false"
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run Database Migrations
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          DJANGO_SECRET_KEY: "dummy-key-for-migrations"
          DJANGO_DEBUG: "false"
        run: |
          python manage.py migrate --noinput

      - name: Ensure Django Superuser Exists
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          DJANGO_SECRET_KEY: "dummy-key-for-migrations"
          DJANGO_DEBUG: "false"
          SUPERUSER_EMAIL: ${{ secrets.SUPERUSER_EMAIL }}
          SUPERUSER_PASSWORD: ${{ secrets.SUPERUSER_PASSWORD }}
          # El nombre va en tres campos desde el 2026-08-25. Si estos
          # secretos no existen, el comando usa "Equipo FILEY": la cuenta
          # se crea igual, solo cambia lo que saluda el panel.
          SUPERUSER_NOMBRE: ${{ secrets.SUPERUSER_NOMBRE }}
          SUPERUSER_PRIMER_APELLIDO: ${{ secrets.SUPERUSER_PRIMER_APELLIDO }}
          SUPERUSER_SEGUNDO_APELLIDO: ${{ secrets.SUPERUSER_SEGUNDO_APELLIDO }}
        run: |
          python manage.py ensure_superuser

      - name: Trigger Render Deploy
        # Assuming you're still using Render, you trigger the new build via Deploy Hook
        # If using another platform, replace this step with the specific deploy action
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -X POST $RENDER_DEPLOY_HOOK_URL
