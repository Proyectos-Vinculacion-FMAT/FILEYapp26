name: Deploy to Production

on:
  push:
    branches:
      - project-test

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./filey

    # Las pruebas necesitan un PostgreSQL de verdad: desde ADR-0003 cada
    # feria vive en su propio schema y SQLite no los tiene, así que ya no
    # sirve como respaldo. El `health-cmd` no es adorno — sin él el paso
    # de pruebas arranca antes de que Postgres acepte conexiones.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: filey_db
          POSTGRES_USER: filey_user
          POSTGRES_PASSWORD: filey_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filey_user -d filey_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # Se instalan las de desarrollo porque incluyen a las de ejecución
      # (`-r requirements.txt`) y además pytest, que hace falta para el
      # paso siguiente. El contenedor que se despliega no usa este
      # entorno: lo construye Render con requirements.txt a secas.
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Las pruebas van ANTES de migrar. Una migración aplicada contra
      # Supabase no se deshace con un `git revert`: si el código no pasa
      # sus propias pruebas, el despliegue tiene que morir mientras la
      # base de datos sigue intacta.
      #
      # Django sustituye el backend de correo por `locmem` en pruebas
      # (ver CLAUDE.md), así que ninguna sale a la red aunque el runner
      # tuviera credenciales.
      - name: Run Tests
        env:
          # El Postgres del `services` de arriba, no el de producción:
          # pytest crea y destruye `test_filey_db` sobre esta instancia.
          DATABASE_URL: "postgres://filey_user:filey_password@localhost:5432/filey_db"
          DJANGO_SECRET_KEY: "dummy-key-for-tests"
          # Se prueba con la configuración endurecida (DEBUG=false), que es
          # la que se despliega: cookies `Secure`, nosniff, referrer-policy.
          DJANGO_DEBUG: "false"
          # Menos el redirect a HTTPS. `SecurityMiddleware` respondería 301
          # a *toda* petición del cliente de pruebas, que habla http contra
          # `testserver`, y la suite entera fallaría sin que nada esté roto.
          # El redirect lo hace Render en su capa, no este proceso.
          DJANGO_SSL_REDIRECT: "false"
        run: |
          pytest

      # Un modelo editado sin generar su migración pasa las pruebas
      # —pytest crea la base desde los modelos, no desde las
      # migraciones— y luego rompe en producción, donde solo existen las
      # migraciones. Este paso es lo que separa los dos casos.
      - name: Check for Missing Migrations
        env:
          DJANGO_SECRET_KEY: "dummy-key-for-migrations"
          DJANGO_DEBUG: "false"
        run: |
          python manage.py makemigrations --check --dry-run

      # `migrate_schemas` y no `migrate`: desde ADR-0003 hay un schema por
      # feria, cada uno con su propia tabla `django_migrations`. Un
      # `migrate` a secas solo tocaría `public` y dejaría a cada edición
      # con el esquema de la versión anterior — sus tablas de contenido
      # se quedarían atrás sin que nada avise.
      #
      # Sin `--shared` ni `--tenant`, aplica a los dos: primero `public`,
      # después cada feria. Es idempotente.
      - name: Run Database Migrations
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          DJANGO_SECRET_KEY: "dummy-key-for-migrations"
          DJANGO_DEBUG: "false"
        run: |
          python manage.py migrate_schemas --noinput

      - name: Ensure Django Superuser Exists
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          DJANGO_SECRET_KEY: "dummy-key-for-migrations"
          DJANGO_DEBUG: "false"
          SUPERUSER_EMAIL: ${{ secrets.SUPERUSER_EMAIL }}
          SUPERUSER_PASSWORD: ${{ secrets.SUPERUSER_PASSWORD }}
          # El nombre va en tres campos desde el 2026-08-25. Si estos
          # secretos no existen, el comando usa "Equipo FILEY": la cuenta
          # se crea igual, solo cambia lo que saluda el panel.
          SUPERUSER_NOMBRE: ${{ secrets.SUPERUSER_NOMBRE }}
          SUPERUSER_PRIMER_APELLIDO: ${{ secrets.SUPERUSER_PRIMER_APELLIDO }}
          SUPERUSER_SEGUNDO_APELLIDO: ${{ secrets.SUPERUSER_SEGUNDO_APELLIDO }}
        run: |
          python manage.py ensure_superuser

      - name: Trigger Render Deploy
        # Assuming you're still using Render, you trigger the new build via Deploy Hook
        # If using another platform, replace this step with the specific deploy action
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -X POST $RENDER_DEPLOY_HOOK_URL
