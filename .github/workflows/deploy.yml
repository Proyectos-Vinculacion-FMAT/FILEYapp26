name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./filey

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Database Migrations
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          DJANGO_SECRET_KEY: "dummy-key-for-migrations"
          DJANGO_DEBUG: "false"
        run: |
          python manage.py migrate --noinput

      - name: Ensure Django Superuser Exists
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          DJANGO_SECRET_KEY: "dummy-key-for-migrations"
          DJANGO_DEBUG: "false"
          SUPERUSER_EMAIL: ${{ secrets.SUPERUSER_EMAIL }}
          SUPERUSER_PASSWORD: ${{ secrets.SUPERUSER_PASSWORD }}
        run: |
          python manage.py ensure_superuser

      - name: Trigger Render Deploy
        # Assuming you're still using Render, you trigger the new build via Deploy Hook
        # If using another platform, replace this step with the specific deploy action
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -X POST $RENDER_DEPLOY_HOOK_URL
